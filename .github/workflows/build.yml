name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 1) 学習済みモデルをスマホ用（ONNX）に変換し、元のモデルと結果が一致するか確認
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: bandit-plus-weights-v1
      - name: Install PyTorch (CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy pyyaml librosa
      - name: Export ONNX model
        run: |
          set -o pipefail
          free -h
          /usr/bin/time -v python -u tools/export_onnx.py --out app/src/main/assets/bandit_plus.onnx 2>&1 | grep -v "^\s*\(Minor\|Major\|Volun\|Invol\|Swaps\|File sys\|Socket\|Signals\|Page size\|Average\|Exit status\|Percent\|System time\|User time\)"
          test -f app/src/main/assets/bandit_plus.onnx

      # 2) アプリをビルド
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk AnimeStemSplitter.apk

      # 3) Android エミュレーター（Pixel と同じ Android 16）で実際に分離を通す
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On-device test (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tools/ci_emulator_test.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-logs
          path: |
            logcat.txt
            device_crash.txt
            device_running.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      # 4) APK を置く（Actions の成果物 + Releases）
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeStemSplitter-apk
          path: AnimeStemSplitter.apk
          compression-level: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: アニメ音声分離 (build ${{ github.run_number }})
          files: AnimeStemSplitter.apk
